# ============================================================
# LLM 调用配置（T7）：profile → provider（protocol）→ model
# 只从环境变量读取密钥；切换模型/协议/Base URL 只改这里或命令行参数。
# 支持两类协议：
#   OPENAI    —— 火山方舟 Coding Plan / DeepSeek / DashScope 兼容模式 / 任意 OpenAI 兼容服务
#   ANTHROPIC —— Claude 官方 / one-api、new-api、LiteLLM 等自建 Anthropic Messages 服务
# ============================================================
llm:
  providers:
    deepseek:
      protocol: OPENAI
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      completions-path: /v1/chat/completions
    ark:
      protocol: OPENAI
      # 火山方舟 Coding Plan 的 OpenAI 兼容入口；注意不是 /api/v3
      base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/coding/v3}
      api-key: ${ARK_API_KEY:}
      completions-path: /chat/completions
    dashscope:
      protocol: OPENAI
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      completions-path: /chat/completions
    local-anthropic:
      # 自建 Anthropic Messages 服务（one-api/new-api/LiteLLM 等）
      protocol: ANTHROPIC
      base-url: ${LOCAL_ANTHROPIC_BASE_URL:http://127.0.0.1:3000}
      api-key: ${LOCAL_ANTHROPIC_API_KEY:}
      completions-path: ${LOCAL_ANTHROPIC_COMPLETIONS_PATH:/v1/messages}
      anthropic-version: ${LOCAL_ANTHROPIC_VERSION:2023-06-01}
    claude:
      protocol: ANTHROPIC
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      completions-path: /v1/messages
      anthropic-version: 2023-06-01

  profiles:
    fast:
      provider: ${LLM_FAST_PROVIDER:deepseek}
      model: ${LLM_FAST_MODEL:deepseek-chat}
      temperature: 0.3
      max-tokens: 2048
      timeout-seconds: 120
      # 订阅制/未填单价时成本记 0，token 照常记账
      input-price-per-1m: 0
      output-price-per-1m: 0
    strong:
      provider: ${LLM_STRONG_PROVIDER:ark}
      model: ${LLM_STRONG_MODEL:doubao-seed-1-6-250615}
      temperature: 0.4
      max-tokens: 4096
      timeout-seconds: 120
      input-price-per-1m: 0
      output-price-per-1m: 0

  retry:
    max-attempts: 3
    initial-backoff-millis: 1000
    multiplier: 2.0
    rate-limit-backoff-millis: 5000

  # 启动期真实调用一次 fast 档做连通性冒烟；默认关闭，避免误计费
  smoke-on-startup: ${LLM_SMOKE_ON_STARTUP:false}
